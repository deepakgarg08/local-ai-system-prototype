[project]
name = "local-ai-system-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13" # 3.11
dependencies = [
    "annotated-types==0.7.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "loguru==0.7.3",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "ollama>=0.6.1",
    "pillow>=12.1.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "pymupdf>=1.27.1",
    "pypdf>=6.7.0",
    "pyspellchecker>=0.8.4",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.1",
    "python-pptx>=1.0.2",
    "rich==14.2.0",
    "sentence-transformers>=5.2.0",
    "streamlit>=1.53.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uvicorn>=0.40.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["llms*", "pipelines*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

# comment below DeprecationWarning in production
[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# [tool.pytest.ini_options]
# filterwarnings = [
#     "ignore:.*SwigPy.*:DeprecationWarning",
# ]

[tool.uv]
package = true

[project.scripts]
rag-parse = "tools.run_pdf_parser:main"
rag-ingest = "pipelines.ingestion.ingest_txt:main"
rag-chunk = "pipelines.chunking.chunk_sections:main"
rag-index = "pipelines.indexing.build_index:main"
rag-eval = "evaluation.runner.run_retrieval_eval:run"
