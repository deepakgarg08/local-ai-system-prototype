[project]
name = "local-ai-system-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13" # 3.11
dependencies = [
    "annotated-types==0.7.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.0",
    "loguru==0.7.3",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "pyspellchecker>=0.8.4",
    "python-dotenv==1.2.1",
    "rich==14.2.0",
    "sentence-transformers>=5.2.0",
    "streamlit>=1.53.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uvicorn>=0.40.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["llms*", "pipelines*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

# comment below DeprecationWarning in production
[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

